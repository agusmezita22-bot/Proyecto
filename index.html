<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Título de la aplicación -->
    <title>Pixel-Hop</title>

    <!-- Ícono para pestaña del navegador (SVG integrado) y enlace a logo.png para accesos directos -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230284c7'/><circle cx='65' cy='40' r='12' fill='%23fff'/><circle cx='68' cy='40' r='5' fill='%23000'/></svg>">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Configuración Web App para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pixel-Hop">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #050811;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', Arial, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 320px;
            height: 480px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 2px solid #334155;
            touch-action: manipulation;
        }
        canvas { display: block; }

        /* --- MODAL PARA PEDIR EL NOMBRE Y MOSTRAR LOGO --- */
        #name-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.98);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .name-box {
            background: #0f172a;
            border: 2px solid #38bdf8;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 16px;
            filter: drop-shadow(0 4px 8px rgba(56, 189, 248, 0.5));
        }
        .name-title {
            color: #ffee00;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .name-input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #475569;
            background: #1e293b;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .name-input:focus {
            border-color: #ffee00;
        }
        .start-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 15px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.4);
        }

        /* --- OVERLAY DE RANKINGS --- */
        #leaderboard-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 17, 0.96);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            z-index: 50;
        }
        .lb-title {
            color: #ffee00;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .player-info-tag {
            color: #38bdf8;
            font-size: 11px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .change-name-btn {
            background: none;
            border: none;
            color: #ffee00;
            cursor: pointer;
            text-decoration: underline;
            font-size: 10px;
            font-family: inherit;
            padding: 0;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            width: 100%;
            justify-content: center;
        }
        .tab-btn {
            background: #1e293b;
            border: 2px solid #475569;
            color: #ffffff;
            padding: 7px 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            border-radius: 6px;
        }
        .tab-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: 900;
        }
        .lb-list {
            width: 100%;
            flex-grow: 1;
            overflow-y: auto;
            background: #0f172a;
            border: 2px solid #334155;
            padding: 8px 10px;
            border-radius: 8px;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            padding: 8px 4px;
            border-bottom: 1px solid #1e293b;
        }
        .lb-item.is-me {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 4px;
        }
        .lb-rank { color: #ffee00; font-weight: 900; width: 30px; }
        .lb-name { flex-grow: 1; color: #ffffff; }
        .lb-score { color: #00ff66; font-weight: 900; }
        
        .close-btn {
            margin-top: 12px;
            background: #00e676;
            color: #000000;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            font-family: inherit;
            border-radius: 8px;
            width: 100%;
        }
        
        #btn-open-lb {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffee00;
            color: #000000;
            border: 2px solid #000000;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 900;
            cursor: pointer;
            z-index: 10;
            border-radius: 20px;
            font-family: inherit;
        }

        /* --- COPYRIGHT BADGE --- */
        .copyright-tag {
            position: absolute;
            bottom: 4px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.65);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            z-index: 15;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="btn-open-lb">🏆 RANKINGS</button>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <div class="copyright-tag">© 2026 Agustin Meza. Todos los derechos reservados.</div>

    <div id="name-overlay">
        <div class="name-box">
            <!-- Logo autoguiado integrado en formato SVG -->
            <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230284c7'/><circle cx='65' cy='40' r='12' fill='%23fff'/><circle cx='68' cy='40' r='5' fill='%23000'/></svg>" alt="Logo de Pixel-Hop" class="game-logo">
            <div class="name-title">¡Ingresa tu Apodo!</div>
            <input type="text" id="player-name-input" class="name-input" placeholder="Tu Nombre o Nick" maxlength="12" autocomplete="off">
            <button class="start-btn" id="btn-save-name">GUARDAR Y JUGAR</button>
        </div>
    </div>

    <div id="leaderboard-overlay">
        <div class="lb-title">Tabla de Récords</div>
        <div class="player-info-tag">
            Jugador: <strong id="current-player-display" style="color:#fff;">-</strong>
            <button class="change-name-btn" id="btn-prompt-change">[Cambiar]</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="sem">Semanal</button>
            <button class="tab-btn" data-tab="mes">Mensual</button>
            <button class="tab-btn" data-tab="prov">Provincia</button>
            <button class="tab-btn" data-tab="nac">Nacional</button>
            <button class="tab-btn" data-tab="int">Global</button>
        </div>
        <div class="lb-list" id="lb-content"></div>
        <button class="close-btn" id="btn-close-lb">VOLVER AL JUEGO</button>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const nameOverlay = document.getElementById("name-overlay");
    const leaderboardOverlay = document.getElementById("leaderboard-overlay");
    const btnSaveName = document.getElementById("btn-save-name");
    const nameInput = document.getElementById("player-name-input");
    const btnOpenLb = document.getElementById("btn-open-lb");
    const btnCloseLb = document.getElementById("btn-close-lb");
    const btnPromptChange = document.getElementById("btn-prompt-change");

    // Prevenir propagación de eventos
    [nameOverlay, leaderboardOverlay].forEach(el => {
        el.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: false });
        el.addEventListener("mousedown", (e) => e.stopPropagation());
    });

    // === GESTIÓN DE JUGADOR ===
    let playerName = localStorage.getItem("ph_player_name") || "";

    function checkPlayerName() {
        if (!playerName || playerName.trim() === "") {
            nameOverlay.style.display = "flex";
        } else {
            nameOverlay.style.display = "none";
            document.getElementById("current-player-display").innerText = playerName;
        }
    }

    function executeSaveName() {
        const val = nameInput.value.trim();
        if (val.length > 0) {
            playerName = val;
            localStorage.setItem("ph_player_name", playerName);
            checkPlayerName();
        }
    }

    btnSaveName.addEventListener("click", (e) => {
        e.stopPropagation();
        executeSaveName();
    });

    nameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            executeSaveName();
        }
    });

    btnPromptChange.addEventListener("click", (e) => {
        e.stopPropagation();
        closeLeaderboard();
        nameInput.value = playerName;
        nameOverlay.style.display = "flex";
    });

    btnOpenLb.addEventListener("click", (e) => {
        e.stopPropagation();
        openLeaderboard();
    });

    btnCloseLb.addEventListener("click", (e) => {
        e.stopPropagation();
        closeLeaderboard();
    });

    // === SONIDOS ===
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playScoreSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } catch (e) {}
    }

    function playJumpSound() {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.06);
        } catch (e) {}
    }

    // === RANKINGS ===
    const mockRankings = {
        sem: [{ name: "JipMaster", score: 24 }, { name: "FlyPro", score: 18 }],
        mes: [{ name: "RetroKing", score: 58 }, { name: "JipMaster", score: 41 }],
        prov: [{ name: "RosarioFlyer", score: 65 }, { name: "SantaFe_Gamer", score: 48 }],
        nac: [{ name: "Arg_Ace", score: 110 }, { name: "Mendoza_Pixel", score: 85 }],
        int: [{ name: "Global_God", score: 189 }, { name: "Tokyo_Jip", score: 150 }]
    };

    let currentTab = "sem";

    function updateLocalRecords(newScore) {
        if (!playerName) return;

        let currentSem = parseInt(localStorage.getItem("ph_score_sem") || "0");
        let currentMes = parseInt(localStorage.getItem("ph_score_mes") || "0");

        if (newScore > currentSem) localStorage.setItem("ph_score_sem", newScore);
        if (newScore > currentMes) localStorage.setItem("ph_score_mes", newScore);

        let bestScore = Math.max(currentSem, newScore);

        ['sem', 'mes', 'prov'].forEach(tab => {
            let user = mockRankings[tab].find(r => r.name === playerName);
            if (user) {
                user.score = Math.max(user.score, bestScore);
            } else if (bestScore > 0) {
                mockRankings[tab].push({ name: playerName, score: bestScore });
            }
        });
    }

    function renderLeaderboard() {
        const content = document.getElementById("lb-content");
        content.innerHTML = "";
        
        let currentSem = parseInt(localStorage.getItem("ph_score_sem") || "0");
        updateLocalRecords(currentSem);

        let list = mockRankings[currentTab] || [];
        list.sort((a, b) => b.score - a.score);

        list.forEach((item, index) => {
            const row = document.createElement("div");
            let isMe = item.name === playerName;
            row.className = "lb-item" + (isMe ? " is-me" : "");
            row.innerHTML = `
                <span class="lb-rank">#${index + 1}</span>
                <span class="lb-name">${item.name} ${isMe ? "(Tú)" : ""}</span>
                <span class="lb-score">${item.score} pts</span>
            `;
            content.appendChild(row);
        });
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            e.stopPropagation();
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentTab = btn.getAttribute("data-tab");
            renderLeaderboard();
        });
    });

    function openLeaderboard() {
        renderLeaderboard();
        leaderboardOverlay.style.display = "flex";
    }

    function closeLeaderboard() {
        leaderboardOverlay.style.display = "none";
    }

    // === JUEGO Y FÍSICAS ===
    let birdX = 70;
    let birdY = 200;
    let birdRadius = 12;
    let birdHitboxRadius = 10;
    
    let gravity = 0.38;
    let velocity = 0;
    let jump = -5.6;
    let wingAngle = 0;

    let pipes = [];
    let pipeWidth = 50;
    let pipeGap = 88;
    let pipeInterval = 90;
    let pipeSpeed = 2.0;
    let frameCount = 0;

    let score = 0;
    let scoreFlashTimer = 0;
    let gameOver = false;
    let gameStarted = false;
    let animationFrameId = null;

    let particles = [];

    function addParticles() {
        for (let i = 0; i < 4; i++) {
            particles.push({
                x: birdX - 5,
                y: birdY + (Math.random() * 8 - 4),
                vx: -Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                radius: Math.random() * 2 + 1.5,
                alpha: 0.8
            });
        }
    }

    function handleInput(e) {
        if (nameOverlay.style.display === "flex" || leaderboardOverlay.style.display === "flex") {
            return;
        }

        if (e && e.cancelable) e.preventDefault();
        initAudio();

        if (!gameStarted) {
            gameStarted = true;
            velocity = jump;
            playJumpSound();
            return;
        }

        if (gameOver) {
            resetGame();
        } else {
            velocity = jump;
            wingAngle = 1.0;
            playJumpSound();
            addParticles();
        }
    }

    document.addEventListener("keydown", (e) => { 
        if (e.code === "Space") handleInput(e); 
    });
    
    canvas.addEventListener("touchstart", handleInput, { passive: false });
    canvas.addEventListener("mousedown", handleInput);

    function resetGame() {
        birdY = 200;
        velocity = 0;
        pipes = [];
        particles = [];
        score = 0;
        frameCount = 0;
        wingAngle = 0;
        gameOver = false;
        gameStarted = true;
        velocity = jump;
        playJumpSound();
    }

    function update() {
        if (!gameStarted || gameOver) return;

        velocity += gravity;
        birdY += velocity;
        wingAngle += (0 - wingAngle) * 0.12;

        if (birdY + birdHitboxRadius > canvas.height - 25 || birdY - birdHitboxRadius < 0) {
            triggerGameOver();
        }

        frameCount++;
        if (frameCount % pipeInterval === 0) {
            let minHeight = 45;
            let maxHeight = canvas.height - pipeGap - minHeight - 25;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                passed: false
            });
        }

        for (let i = 0; i < pipes.length; i++) {
            let p = pipes[i];
            p.x -= pipeSpeed;

            let inPipeX = birdX + birdHitboxRadius > p.x && birdX - birdHitboxRadius < p.x + pipeWidth;
            let inTopPipeY = birdY - birdHitboxRadius < p.top;
            let inBottomPipeY = birdY + birdHitboxRadius > p.top + pipeGap;

            if (inPipeX && (inTopPipeY || inBottomPipeY)) {
                triggerGameOver();
            }

            let pipeCenter = p.x + (pipeWidth / 2);
            if (birdX >= pipeCenter && !p.passed) {
                score++;
                p.passed = true;
                scoreFlashTimer = 10;
                playScoreSound();
            }
        }

        if (pipes.length > 0 && pipes[0].x < -pipeWidth) {
            pipes.shift();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let pt = particles[i];
            pt.x += pt.vx;
            pt.y += pt.vy;
            pt.alpha -= 0.05;
            if (pt.alpha <= 0) particles.splice(i, 1);
        }

        if (scoreFlashTimer > 0) scoreFlashTimer--;
    }

    function triggerGameOver() {
        gameOver = true;
        updateLocalRecords(score);
    }

    // === RENDER DÍA / NOCHE ===
    function drawBackground() {
        let isDay = score >= 10;

        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        if (isDay) {
            skyGrad.addColorStop(0, "#38bdf8");
            skyGrad.addColorStop(0.6, "#7dd3fc");
            skyGrad.addColorStop(1, "#bae6fd");
        } else {
            skyGrad.addColorStop(0, "#0a0f1d");
            skyGrad.addColorStop(0.6, "#151b33");
            skyGrad.addColorStop(1, "#281537");
        }
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let astroGrad = ctx.createRadialGradient(250, 70, 2, 250, 70, 25);
        if (isDay) {
            astroGrad.addColorStop(0, "#ffffff");
            astroGrad.addColorStop(0.4, "#fef08a");
            astroGrad.addColorStop(1, "rgba(253, 224, 71, 0)");
        } else {
            astroGrad.addColorStop(0, "#ffffff");
            astroGrad.addColorStop(0.3, "#fef08a");
            astroGrad.addColorStop(1, "rgba(254, 240, 138, 0)");
        }
        ctx.fillStyle = astroGrad;
        ctx.beginPath();
        ctx.arc(250, 70, 25, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = isDay ? "rgba(255, 255, 255, 0.5)" : "rgba(255, 255, 255, 0.05)";
        ctx.beginPath();
        ctx.arc(80, 120, 30, 0, Math.PI * 2);
        ctx.arc(110, 110, 40, 0, Math.PI * 2);
        ctx.arc(140, 120, 30, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawPipes() {
        for (let i = 0; i < pipes.length; i++) {
            let p = pipes[i];

            let pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + pipeWidth, 0);
            pipeGrad.addColorStop(0, "#15803d");
            pipeGrad.addColorStop(0.3, "#4ade80");
            pipeGrad.addColorStop(0.7, "#22c55e");
            pipeGrad.addColorStop(1, "#14532d");

            ctx.fillStyle = pipeGrad;
            ctx.fillRect(p.x, 0, pipeWidth, p.top);
            ctx.fillStyle = "#166534";
            ctx.fillRect(p.x - 3, p.top - 12, pipeWidth + 6, 12);

            let bottomY = p.top + pipeGap;
            let bottomHeight = canvas.height - bottomY - 25;
            ctx.fillStyle = pipeGrad;
            ctx.fillRect(p.x, bottomY, pipeWidth, bottomHeight);
            ctx.fillStyle = "#166534";
            ctx.fillRect(p.x - 3, bottomY, pipeWidth + 6, 12);
        }
    }

    function drawBird() {
        for (let pt of particles) {
            ctx.fillStyle = `rgba(56, 189, 248, ${pt.alpha})`;
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(birdX, birdY);
        let angle = Math.min(Math.max(velocity * 0.1, -0.6), 1.2);
        ctx.rotate(angle);

        ctx.save();
        ctx.translate(-2, -2);
        ctx.rotate(wingAngle - 0.2);
        ctx.fillStyle = "#0284c7";
        ctx.beginPath();
        ctx.ellipse(-4, 0, 9, 4, Math.PI / 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        let birdGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, birdRadius);
        birdGrad.addColorStop(0, "#67e8f9");
        birdGrad.addColorStop(0.7, "#0284c7");
        birdGrad.addColorStop(1, "#0369a1");

        ctx.fillStyle = birdGrad;
        ctx.beginPath();
        ctx.arc(0, 0, birdRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(-3, 1);
        ctx.rotate(-wingAngle + 0.1);
        let wingGrad = ctx.createLinearGradient(-8, 0, 2, 8);
        wingGrad.addColorStop(0, "#ffffff");
        wingGrad.addColorStop(1, "#38bdf8");
        ctx.fillStyle = wingGrad;
        ctx.beginPath();
        ctx.ellipse(-2, 3, 10, 5, Math.PI / 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(4, -3, 4.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0f172a";
        ctx.beginPath();
        ctx.arc(5, -3, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fbbf24";
        ctx.beginPath();
        ctx.moveTo(7, 1);
        ctx.lineTo(14, 4);
        ctx.lineTo(7, 7);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawGround() {
        let isDay = score >= 10;
        let groundGrad = ctx.createLinearGradient(0, canvas.height - 25, 0, canvas.height);
        
        if (isDay) {
            groundGrad.addColorStop(0, "#16a34a");
            groundGrad.addColorStop(1, "#15803d");
        } else {
            groundGrad.addColorStop(0, "#1e293b");
            groundGrad.addColorStop(1, "#0f172a");
        }

        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, canvas.height - 25, canvas.width, 25);

        ctx.fillStyle = isDay ? "#fde047" : "#38bdf8";
        ctx.fillRect(0, canvas.height - 25, canvas.width, 3);
    }

    function drawOutlinedText(text, x, y, font, fillColor, strokeColor = "#000000", lineWidth = 4) {
        ctx.font = font;
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = lineWidth;
        ctx.lineJoin = "round";
        ctx.strokeText(text, x, y);
        ctx.fillStyle = fillColor;
        ctx.fillText(text, x, y);
    }

    function drawUI() {
        let scoreColor = scoreFlashTimer > 0 ? "#00ff66" : "#ffee00";
        drawOutlinedText("SCORE: " + score, 15, 36, "900 22px 'Arial Black', sans-serif", scoreColor);

        let bestSem = localStorage.getItem("ph_score_sem") || 0;
        drawOutlinedText("MÁX. SEMANAL: " + bestSem, 15, 56, "bold 12px 'Arial Black', sans-serif", "#00f0ff", "#000000", 3);

        if (!gameStarted && nameOverlay.style.display !== "flex") {
            ctx.textAlign = "center";
            drawOutlinedText("TOCA PARA EMPEZAR", canvas.width / 2, canvas.height / 2, "900 18px 'Arial Black', sans-serif", "#ffee00", "#000000", 4);
            ctx.textAlign = "start";
        }

        if (gameOver) {
            ctx.fillStyle = "rgba(5, 8, 17, 0.88)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";
            drawOutlinedText("GAME OVER", canvas.width / 2, canvas.height / 2 - 25, "900 28px 'Arial Black', sans-serif", "#ff2a5f", "#000000", 6);
            drawOutlinedText("Puntaje Final: " + score, canvas.width / 2, canvas.height / 2 + 15, "bold 18px 'Arial Black', sans-serif", "#ffffff", "#000000", 4);
            drawOutlinedText("Toca para Reiniciar", canvas.width / 2, canvas.height / 2 + 45, "bold 14px 'Arial Black', sans-serif", "#ffee00", "#000000", 3);
            ctx.textAlign = "start";
        }
    }

    function draw() {
        drawBackground();
        drawPipes();
        drawGround();
        drawBird();
        drawUI();
    }

    function loop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(loop);
    }

    checkPlayerName();
    loop();
</script>
</body>
</html>
