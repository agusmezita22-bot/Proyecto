<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel-Hop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 360px; height: 640px; background: #70c5ce; border-radius: 12px; overflow: hidden; border: 3px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Modales e Interfaz */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        .hidden { display: none !important; }
        h2 { color: #f1e05a; font-size: 22px; margin-bottom: 6px; text-transform: uppercase; text-shadow: 1px 1px 2px #000; }
        .player-info { color: #8b949e; font-size: 13px; margin-bottom: 12px; }
        .player-info span { color: #58a6ff; font-weight: bold; cursor: pointer; text-decoration: underline; }
        
        .tabs { display: flex; gap: 4px; width: 100%; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px 0; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-size: 11px; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; }
        
        .records-list { width: 100%; height: 380px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .lb-row { display: flex; justify-content: space-between; padding: 8px 12px; background: #21262d; border-radius: 4px; color: #c9d1d9; font-size: 13px; }
        .lb-row.is-me { border: 1px solid #238636; background: #122216; color: #3fb950; font-weight: bold; }
        
        .btn { width: 100%; padding: 12px; margin-top: 10px; background: #238636; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
        .btn-sec { background: #30363d; margin-top: 6px; }
        .btn:active { opacity: 0.8; }
        
        #score-display { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 36px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); pointer-events: none; z-index: 5; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-display">0</div>
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <!-- PANTALLA DE GAME OVER / INICIO -->
    <div id="menuModal" class="modal">
        <h2 id="menuTitle">PIXEL-HOP</h2>
        <p class="player-info">Jugador: <strong id="lblPlayerName">Agus</strong> [<span onclick="promptChangeName()">Cambiar</span>]</p>
        <p id="finalScoreText" style="color: white; font-size: 18px; margin-bottom: 15px;" class="hidden">Puntaje: 0</p>
        <button class="btn" onclick="startGame()">JUGAR</button>
        <button class="btn btn-sec" onclick="openLeaderboard()">🏆 RANKINGS</button>
    </div>

    <!-- TABLA DE RÉCORDS -->
    <div id="leaderboardModal" class="modal hidden">
        <h2>Tabla de Récords</h2>
        <div class="player-info">Jugador: <strong id="lblPlayerNameLb">Agus</strong></div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('sem', this)">Semanal</button>
            <button class="tab-btn" onclick="switchTab('mes', this)">Mensual</button>
            <button class="tab-btn" onclick="switchTab('prov', this)">Provincia</button>
            <button class="tab-btn" onclick="switchTab('nac', this)">Nacional</button>
            <button class="tab-btn" onclick="switchTab('global', this)">Global</button>
        </div>

        <div id="recordsList" class="records-list">
            <p style="color: #8b949e; text-align: center; margin-top: 20px;">Cargando...</p>
        </div>

        <button class="btn btn-sec" onclick="closeLeaderboard()">VOLVER</button>
    </div>
</div>

<script>
// --- CONFIGURACIÓN BACKEND ---
const API_URL = "https://proyecto-y42g.onrender.com/api";
const SECRET_KEY = "SuperSecretPixelHopKey2026";

let playerToken = localStorage.getItem("ph_token") || "";
let playerName = localStorage.getItem("ph_name") || "Agus";
let activeTab = "sem";

function updateNameDisplays() {
    document.getElementById("lblPlayerName").textContent = playerName;
    document.getElementById("lblPlayerNameLb").textContent = playerName;
}
updateNameDisplays();

async function registerPlayer(nick) {
    try {
        const res = await fetch(`${API_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: nick, country: 'ARG', province: 'Santa Fe', existingToken: playerToken })
        });
        const data = await res.json();
        if (data.token) {
            playerToken = data.token;
            playerName = data.nickname;
            localStorage.setItem("ph_token", playerToken);
            localStorage.setItem("ph_name", playerName);
            updateNameDisplays();
        }
    } catch (e) {
        console.error("Error registrando jugador:", e);
    }
}

function promptChangeName() {
    const newName = prompt("Ingresa tu apodo:", playerName);
    if (newName && newName.trim().length > 0) {
        registerPlayer(newName.trim());
    }
}

async function generateSignature(token, score, duration, pipes) {
    const encoder = new TextEncoder();
    const keyData = encoder.encode(SECRET_KEY);
    const messageData = encoder.encode(`${token}:${score}:${duration}:${pipes}`);
    const cryptoKey = await crypto.subtle.importKey('raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const signatureArray = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
    return Array.from(new Uint8Array(signatureArray)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function sendScoreBackend(score, duration, pipes) {
    if (score <= 0) return;
    if (!playerToken) await registerPlayer(playerName);

    const safeDuration = Math.max(duration, 2);
    const signature = await generateSignature(playerToken, score, safeDuration, pipes);

    try {
        await fetch(`${API_URL}/scores`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: playerToken,
                score: score,
                duration: safeDuration,
                pipesPassed: pipes,
                signature: signature
            })
        });
    } catch (e) {
        console.error("Error al enviar puntaje:", e);
    }
}

async function fetchLeaderboard(tab) {
    const container = document.getElementById("recordsList");
    container.innerHTML = `<p style="color: #8b949e; text-align: center; margin-top: 20px;">Cargando...</p>`;

    try {
        const res = await fetch(`${API_URL}/leaderboard?tab=${tab}&province=Santa%20Fe&country=ARG`);
        const data = await res.json();
        
        container.innerHTML = "";
        if (!data || data.length === 0) {
            container.innerHTML = `<p style="color: #8b949e; text-align: center; margin-top: 20px;">Sin registros aún</p>`;
            return;
        }

        data.forEach((item, idx) => {
            const row = document.createElement("div");
            const isMe = item.nickname === playerName;
            row.className = `lb-row ${isMe ? 'is-me' : ''}`;
            row.innerHTML = `<span>#${idx + 1} ${item.nickname}</span><span>${item.max_score} pts</span>`;
            container.appendChild(row);
        });
    } catch (e) {
        container.innerHTML = `<p style="color: #f85149; text-align: center; margin-top: 20px;">Error de conexión</p>`;
    }
}

function switchTab(tab, btn) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fetchLeaderboard(tab);
}

function openLeaderboard() {
    document.getElementById("leaderboardModal").classList.remove("hidden");
    fetchLeaderboard(activeTab);
}

function closeLeaderboard() {
    document.getElementById("leaderboardModal").classList.add("hidden");
}

if (!playerToken) registerPlayer(playerName);

// --- LÓGICA DEL JUEGO (CANVAS) ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let bird = { x: 60, y: 300, radius: 12, velocity: 0, gravity: 0.45, jump: -7.5 };
let pipes = [];
let score = 0;
let pipesPassed = 0;
let gameRunning = false;
let gameStartTime = 0;
let frameCount = 0;

function jump() {
    if (gameRunning) {
        bird.velocity = bird.jump;
    }
}

window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); jump(); });
canvas.addEventListener("mousedown", jump);

function startGame() {
    bird.y = 300;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    pipesPassed = 0;
    frameCount = 0;
    gameStartTime = Date.now();
    document.getElementById("score-display").textContent = "0";
    document.getElementById("menuModal").classList.add("hidden");
    gameRunning = true;
    requestAnimationFrame(gameLoop);
}

function gameOver() {
    gameRunning = false;
    const duration = (Date.now() - gameStartTime) / 1000;
    
    sendScoreBackend(score, duration, pipesPassed);

    document.getElementById("menuTitle").textContent = "GAME OVER";
    document.getElementById("finalScoreText").textContent = `Puntaje: ${score}`;
    document.getElementById("finalScoreText").classList.remove("hidden");
    document.getElementById("menuModal").classList.remove("hidden");
}

function gameLoop() {
    if (!gameRunning) return;

    // Actualizar Pájaro
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
        gameOver();
        return;
    }

    // Generar Tuberías
    frameCount++;
    if (frameCount % 100 === 0) {
        const gap = 130;
        const minTop = 50;
        const maxTop = canvas.height - gap - 100;
        const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
        pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap, passed: false });
    }

    // Mover y Colisionar Tuberías
    for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];
        p.x -= 2;

        // Detección de Colisión
        if (
            bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + 50 &&
            (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom)
        ) {
            gameOver();
            return;
        }

        // Sumar Puntos
        if (!p.passed && p.x + 50 < bird.x) {
            p.passed = true;
            score++;
            pipesPassed++;
            document.getElementById("score-display").textContent = score;
        }
    }

    // Limpiar tuberías fuera de pantalla
    pipes = pipes.filter(p => p.x > -60);

    // Dibujar Fondo
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Dibujar Tuberías
    ctx.fillStyle = "#2e7d32";
    pipes.forEach(p => {
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.fillRect(p.x, canvas.height - p.bottom, 50, p.bottom);
    });

    // Dibujar Pájaro
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    requestAnimationFrame(gameLoop);
}

// Dibujar pantalla inicial limpia
ctx.fillStyle = "#70c5ce";
ctx.fillRect(0, 0, canvas.width, canvas.height);
</script>
</body>
</html>
