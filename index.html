<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel-Hop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 360px; height: 640px; background: #0d1117; border-radius: 12px; overflow: hidden; border: 2px solid #30363d; }
        canvas { width: 100%; height: 100%; display: block; }
        
        /* Modal de Leaderboard */
        .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.95); display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        .hidden { display: none !important; }
        h2 { color: #f1e05a; font-size: 20px; margin-bottom: 8px; text-transform: uppercase; }
        .player-info { color: #8b949e; font-size: 13px; margin-bottom: 12px; }
        .player-info span { color: #58a6ff; font-weight: bold; cursor: pointer; text-decoration: underline; }
        
        .tabs { display: flex; gap: 4px; width: 100%; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 6px 0; background: #21262d; border: 1px solid #30363d; color: #8b949e; font-size: 11px; border-radius: 6px; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #1f6feb; color: #fff; border-color: #388bfd; font-weight: bold; }
        
        .records-list { width: 100%; flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .lb-row { display: flex; justify-content: space-between; padding: 6px 10px; background: #21262d; border-radius: 4px; color: #c9d1d9; font-size: 13px; }
        .lb-row.is-me { border: 1px solid #238636; background: #122216; color: #3fb950; font-weight: bold; }
        
        .btn-main { width: 100%; padding: 12px; margin-top: 10px; background: #238636; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
        .btn-main:active { background: #2ea043; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <!-- TABLA DE RÉCORDS -->
    <div id="leaderboardModal" class="modal hidden">
        <h2>Tabla de Récords</h2>
        <div class="player-info">Jugador: <strong id="lblPlayerName">Agus</strong> [<span onclick="promptChangeName()">Cambiar</span>]</div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('sem', this)">Semanal</button>
            <button class="tab-btn" onclick="switchTab('mes', this)">Mensual</button>
            <button class="tab-btn" onclick="switchTab('prov', this)">Provincia</button>
            <button class="tab-btn" onclick="switchTab('nac', this)">Nacional</button>
            <button class="tab-btn" onclick="switchTab('global', this)">Global</button>
        </div>

        <div id="recordsList" class="records-list">
            <p style="color: #8b949e; text-align: center; margin-top: 20px;">Cargando...</p>
        </div>

        <button class="btn-main" onclick="closeLeaderboard()">VOLVER AL JUEGO</button>
    </div>
</div>

<script>
const API_URL = "https://proyecto-y42g.onrender.com/api";
const SECRET_KEY = "SuperSecretPixelHopKey2026";

let playerToken = localStorage.getItem("ph_token") || "";
let playerName = localStorage.getItem("ph_name") || "Agus";
let activeTab = "sem";

document.getElementById("lblPlayerName").textContent = playerName;

// 1. REGISTRO / AUTENTICACIÓN
async function registerPlayer(nick) {
    try {
        const res = await fetch(`${API_URL}/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: nick, country: 'ARG', province: 'Santa Fe', existingToken: playerToken })
        });
        const data = await res.json();
        if (data.token) {
            playerToken = data.token;
            playerName = data.nickname;
            localStorage.setItem("ph_token", playerToken);
            localStorage.setItem("ph_name", playerName);
            document.getElementById("lblPlayerName").textContent = playerName;
        }
    } catch (e) {
        console.error("Error registrando jugador:", e);
    }
}

function promptChangeName() {
    const newName = prompt("Ingresa tu nuevo apodo:", playerName);
    if (newName && newName.trim().length > 0) {
        registerPlayer(newName.trim());
    }
}

// 2. FIRMA HMAC Y ENVÍO DE SCORE
async function generateSignature(token, score, duration, pipes) {
    const encoder = new TextEncoder();
    const keyData = encoder.encode(SECRET_KEY);
    const messageData = encoder.encode(`${token}:${score}:${duration}:${pipes}`);
    
    const cryptoKey = await crypto.subtle.importKey(
        'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
    );
    const signatureArray = await crypto.subtle.sign('HMAC', cryptoKey, messageData);
    return Array.from(new Uint8Array(signatureArray)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function sendScoreBackend(score) {
    if (score <= 0) return;
    if (!playerToken) await registerPlayer(playerName);

    const duration = 10;
    const pipes = score;
    const signature = await generateSignature(playerToken, score, duration, pipes);

    try {
        await fetch(`${API_URL}/scores`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                token: playerToken,
                score: score,
                duration: duration,
                pipesPassed: pipes,
                signature: signature
            })
        });
    } catch (e) {
        console.error("Error al enviar puntaje:", e);
    }
}

// 3. CONSULTAR TABLA DE POSICIONES
async function fetchLeaderboard(tab) {
    const container = document.getElementById("recordsList");
    container.innerHTML = `<p style="color: #8b949e; text-align: center; margin-top: 20px;">Cargando...</p>`;

    try {
        const res = await fetch(`${API_URL}/leaderboard?tab=${tab}&province=Santa%20Fe&country=ARG`);
        const data = await res.json();
        
        container.innerHTML = "";
        if (!data || data.length === 0) {
            container.innerHTML = `<p style="color: #8b949e; text-align: center; margin-top: 20px;">Sin registros aún</p>`;
            return;
        }

        data.forEach((item, idx) => {
            const row = document.createElement("div");
            const isMe = item.nickname === playerName;
            row.className = `lb-row ${isMe ? 'is-me' : ''}`;
            row.innerHTML = `<span>#${idx + 1} ${item.nickname}</span><span>${item.max_score} pts</span>`;
            container.appendChild(row);
        });
    } catch (e) {
        container.innerHTML = `<p style="color: #f85149; text-align: center; margin-top: 20px;">Error al cargar datos</p>`;
    }
}

function switchTab(tab, btn) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fetchLeaderboard(tab);
}

function openLeaderboard() {
    document.getElementById("leaderboardModal").classList.remove("hidden");
    fetchLeaderboard(activeTab);
}

function closeLeaderboard() {
    document.getElementById("leaderboardModal").classList.add("hidden");
}

// INICIALIZACIÓN DE JUEGO Y REGISTRO INICIAL
if (!playerToken) registerPlayer(playerName);

// Lógica básica de demostración del juego en Canvas
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let currentScore = 0;

function drawGame() {
    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Toca para hacer 1 punto y probar", canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillText(`Puntaje actual: ${currentScore}`, canvas.width / 2, canvas.height / 2);
    ctx.fillStyle = "#238636";
    ctx.fillRect(80, 360, 200, 40);
    ctx.fillStyle = "#ffffff";
    ctx.fillText("VER RANKING", canvas.width / 2, 385);
}

canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    
    if (y > 360 && y < 400) {
        openLeaderboard();
    } else {
        currentScore++;
        drawGame();
        sendScoreBackend(currentScore);
    }
});

drawGame();
</script>
</body>
</html>
